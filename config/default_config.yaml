# CARLA研究项目配置文件

# CARLA服务器设置
carla:
  host: "localhost"
  port: 2000
  timeout: 10.0
  
  # 同步模式设置（推荐用于研究）
  synchronous_mode: true
  fixed_delta_seconds: 0.05  # 20 FPS

# 世界设置
world:
  # 默认地图 (可选: Town01, Town02, Town03, Town04, Town05, Town06, Town07, Town10HD)
  default_map: "Town01"
  
  # 天气设置
  weather:
    cloudiness: 0.0
    precipitation: 0.0
    sun_azimuth_angle: 0.0
    sun_altitude_angle: 75.0

# 传感器设置
sensors:
  rgb_camera:
    image_size_x: 800
    image_size_y: 600
    fov: 90
    sensor_tick: 0.1
  
  depth_camera:
    image_size_x: 800
    image_size_y: 600
    fov: 90
    sensor_tick: 0.1
  
  lidar:
    channels: 32
    range: 50
    points_per_second: 56000
    rotation_frequency: 10

# 数据收集设置
data_collection:
  output_dir: "data/"
  save_images: true
  save_lidar: true
  save_measurements: true

# 实验设置
experiments:
  # 车辆数量
  num_vehicles: 10
  num_walkers: 50
  
  # 实验时长（秒）
  duration: 300
  
  # 是否启用自动驾驶
  autopilot: true

# 算法设置
algorithms:
  path_planning:
    method: "A*"  # A*, RRT, PRM
    resolution: 1.0
  
  perception:
    object_detection: "YOLO"
    tracking: "SORT"